name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm python3

      - name: Check tools
        run: |
          clang --version
          ld.lld --version
          llvm-objcopy --version

      - name: Build kernel
        run: make

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: build/kernel.bin
